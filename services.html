  <style>
    /* Page-scoped styles only */
    header.site{
      display:flex;align-items:center;justify-content:space-between;
      padding:16px 20px;border-bottom:1px solid #eee;
    }
    .brand{font-weight:700}
    nav a{margin-left:18px;text-decoration:none;color:#111;font-size:.95rem}
    nav a[aria-current="page"]{text-decoration:underline}

    .page-wrap{max-width:1100px;margin:0 auto;padding:40px 20px}
    .headline{margin:0 0 8px;font-size:clamp(28px,4vw,40px)}
    .subhead{color:#444;max-width:70ch;margin:0 0 26px}

    .section-title{margin:36px 0 14px;font-size:1.1rem;letter-spacing:.02em;text-transform:uppercase;color:#222}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}

    .card{
      border:1px solid #e8e8e8;border-radius:12px;padding:18px;background:#fff;
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.06)}
    .card h3{margin:0 0 8px;font-size:1.2rem}
    .card p{margin:0 0 10px;color:#444}
    .pill{display:inline-block;font-size:.75rem;padding:6px 8px;border-radius:999px;border:1px solid #ddd;background:#fafafa;margin-right:6px;margin-bottom:6px}
    ul.check{padding-left:18px;margin:10px 0 0}
    ul.check li{margin:6px 0}

    .pricing{
      display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px
    }
    .price{border:1px solid #e8e8e8;border-radius:12px;padding:18px;background:#fff}
    .price h4{margin:0 0 6px}
    .price .num{font-size:1.6rem;font-weight:700;margin:0 0 8px}
    .muted{color:#666}

    .process{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
    .step{border:1px dashed #e6e6e6;border-radius:12px;padding:14px;background:#fcfcfc}
    .step strong{display:block;margin-bottom:6px}

    .cta{border:1px solid #e8e8e8;border-radius:14px;padding:22px;background:#fafafa;display:flex;flex-direction:column;gap:12px;margin-top:28px}
    .btn{display:inline-block;padding:12px 14px;border-radius:10px;border:1px solid #111;text-decoration:none;font-size:.95rem}
    .btn.primary{background:#111;color:#fff}
    .btn.ghost{background:#fff;color:#111}

    details{border:1px solid #e8e8e8;border-radius:12px;padding:14px;background:#fff}
    details+details{margin-top:10px}
    summary{cursor:pointer;font-weight:600}

    footer.site{border-top:1px solid #eee;padding:20px;text-align:center;color:#666;margin-top:40px}
  </style>
</head>
